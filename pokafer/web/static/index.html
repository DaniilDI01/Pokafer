<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokafer — веб-стол</title>
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
<header>
  <div class="brand">Pokafer <span>веб-стол</span></div>
  <div class="bot-setup">
    <span class="dim">боты:</span>
    <div class="bot-chips" id="botChips"></div>
    <button id="addBotBtn" class="ghost small" title="Добавить бота (до 5)">+ бот</button>
  </div>
  <button id="hintBtn" class="ghost" title="Что бы сделал мозг на вашем месте">💡 подсказка</button>
</header>

<main>
  <section class="table-wrap">
    <div class="table">
      <div class="villains" id="villains"></div>

      <div class="middle">
        <div class="result-strip hidden" id="resultStrip"></div>
        <div class="board" id="board"></div>
        <div class="pot" id="pot"></div>
        <div class="street" id="street"></div>
      </div>

      <div class="seat hero" id="seatHero">
        <div class="cards" id="hCards"></div>
        <div class="avatar">🙂</div>
        <div class="plate">
          <div class="name">Вы <span class="button-mark" id="heroBtn"></span></div>
          <div class="stack" id="hStack">200</div>
        </div>
        <div class="bet-chip" id="hBet"></div>
        <div class="combo" id="combo"></div>
      </div>
    </div>

    <div class="actionbar" id="actionbar">
      <button id="nextHandFloat" class="primary big hidden">▶ Следующая рука</button>
      <button id="foldBtn" class="danger">Фолд</button>
      <button id="checkCallBtn" class="primary">Чек</button>
      <div class="raise-group">
        <button id="raiseBtn" class="success">Рейз</button>
        <input type="range" id="raiseSlider">
        <input type="number" id="raiseInput" step="1">
        <div class="presets">
          <button data-preset="min">мин</button>
          <button data-preset="half">½ банка</button>
          <button data-preset="pot">банк</button>
          <button data-preset="max">олл-ин</button>
        </div>
      </div>
    </div>
  </section>

  <aside class="log-panel">
    <div class="log-title">Ход раздачи</div>
    <div class="log" id="log"></div>
  </aside>
</main>

<div class="statusline" id="status">подключение…</div>

<script src="/static/app.js?v=3"></script>
</body>
</html>
