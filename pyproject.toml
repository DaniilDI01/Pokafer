[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokafer"
version = "0.1.0"
description = "Pokafer — модульный покерный ИИ: JSON-мозг, решает офлайн по истории и в реальном времени"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["pokafer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
