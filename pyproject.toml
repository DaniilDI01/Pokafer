[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokafer"
version = "0.1.0"
description = "Pokafer — модульный покерный ИИ: JSON-мозг, решает офлайн по истории и в реальном времени"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
eyes = [
    "pillow>=10",
    "mss>=9",
    "pynput>=1.7",
    "selenium>=4.20",
]
# распознавание чисел глазами: готовая модель (PP-OCRv5, ONNX Runtime),
# работает локально и без сети; глазам без чисел она не нужна
ocr = [
    "rapidocr>=3.10",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[project.scripts]
pokafer = "pokafer.cli:main"

[tool.setuptools.packages.find]
include = ["pokafer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
