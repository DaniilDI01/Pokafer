<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokafer — веб-стол</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">Pokafer <span>веб-стол</span></div>
  <div class="controls">
    <label>мозг:
      <select id="strategy"></select>
    </label>
    <button id="hintBtn" class="ghost" title="Показать, что бы сделал мозг на вашем месте">💡 подсказка</button>
  </div>
</header>

<main>
  <section class="table-wrap">
    <div class="table">
      <div class="seat villain" id="seatVillain">
        <div class="avatar">🤖</div>
        <div class="plate">
          <div class="name" id="vName">Мозг</div>
          <div class="stack" id="vStack">200</div>
        </div>
        <div class="bet-chip" id="vBet"></div>
        <div class="cards" id="vCards"></div>
      </div>

      <div class="middle">
        <div class="board" id="board"></div>
        <div class="pot" id="pot"></div>
        <div class="street" id="street"></div>
      </div>

      <div class="seat hero" id="seatHero">
        <div class="cards" id="hCards"></div>
        <div class="avatar">🙂</div>
        <div class="plate">
          <div class="name">Вы</div>
          <div class="stack" id="hStack">200</div>
        </div>
        <div class="bet-chip" id="hBet"></div>
        <div class="combo" id="combo"></div>
      </div>
    </div>

    <div class="actionbar" id="actionbar">
      <button id="foldBtn" class="danger">Фолд</button>
      <button id="checkCallBtn" class="primary">Чек</button>
      <div class="raise-group">
        <button id="raiseBtn" class="success">Рейз</button>
        <input type="range" id="raiseSlider">
        <input type="number" id="raiseInput" step="1">
        <div class="presets">
          <button data-preset="min">мин</button>
          <button data-preset="half">½ банка</button>
          <button data-preset="pot">банк</button>
          <button data-preset="max">олл-ин</button>
        </div>
      </div>
    </div>
    <div class="newhand-bar hidden" id="newhandBar">
      <button id="newHandBtn" class="primary big">▶ Следующая рука</button>
    </div>
  </section>

  <aside class="log-panel">
    <div class="log-title">Ход раздачи</div>
    <div class="log" id="log"></div>
  </aside>
</main>

<div class="overlay hidden" id="overlay">
  <div class="banner" id="banner"></div>
</div>

<div class="statusline" id="status">подключение…</div>

<script src="/static/app.js"></script>
</body>
</html>
